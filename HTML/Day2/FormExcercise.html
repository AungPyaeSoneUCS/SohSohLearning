<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Exercise</title>
</head>
<body>
    <form action="SubmitFormExercise.html" method="get" enctype="multipart/form-data">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" ><br>
        <label for="birthday">Birthday:</label>
        <input type="date" id="birthday" name="birthday" required><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required><br>
        <label for="country">What is your Country:</label>
        <input type="country" id="country" name="country" required><br>
        <label for="about">About Yourself:</label>
        <textarea id="about" name="about" rows="7" cols="15" required></textarea><br>
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color" required><br>
        <label for="pl">Favourite Programming Language:</label>
        <select id="pl" name="pl" required>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c++">C++</option>
            <option value="javascript">JavaScript</option>
            <option value="ruby">Ruby</option>
            <option value="go">Go</option>
            <option value="c#">C#</option>
            <option value="php">PHP</option>
            <option value="swift">Swift</option>
            <option value="kotlin">Kotlin</option>
        </select><br>
        <input type="submit" value="Select">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
