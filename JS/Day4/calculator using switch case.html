<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using JavaScript with arrow function </title>
</head>
<body>

    <h1>Calculator</h1>
    <p>This is a simple calculator built with JavaScript using arrow functions.</p>

    <label for="num1">Number 1:</label>
    <input type="number" id="num1" placeholder="Enter first number">

    <label for="num2">Number 2:</label>
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="calculate('+')">Add</button>
    <button onclick="calculate('-')">Subtract</button>
    <button onclick="calculate('*')">Multiply</button>
    <button onclick="calculate('/')">Divide</button>
    <button onclick="calculate('%')">Modulus</button>
    <button onclick="calculate('**')">Exponent</button>
    <p id="result"></p>


    <script>
        
        const calculate = (operator) => {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            let result;

            switch (operator) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    result = num1 / num2;
                    break;
                case '%':
                    result = num1 % num2;
                    break;
                case '**':
                    result = num1 ** num2;
                    break;
                default:
                    result = 'Invalid operator';
            }

            document.getElementById('result').innerText = `Result: ${result}`;
        };
