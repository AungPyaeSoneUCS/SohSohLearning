<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using JavaScript with arrow function </title>
</head>
<body>

    <h1>Calculator</h1>
    <p>This is a simple calculator built with JavaScript using arrow functions.</p>

    <label for="num1">Number 1:</label>
    <input type="number" id="num1" placeholder="Enter first number">

    <label for="num2">Number 2:</label>
    <input type="number" id="num2" placeholder="Enter second number">

    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <button onclick="modulus()">Modulus</button>
    <button onclick="exponent()">Exponent</button>
    <p id="result"></p>


    <script>
    // A helper function to grab the latest values right when a button is clicked
    const getValues = () => {
        const num1 = parseFloat(document.getElementById('num1').value);
        const num2 = parseFloat(document.getElementById('num2').value);
        // Fallback to 0 if the user leaves the input blank
        return { 
            n1: isNaN(num1) ? 0 : num1, 
            n2: isNaN(num2) ? 0 : num2 
        };
    };

    const add = () => {
        const { n1, n2 } = getValues();
        document.getElementById('result').innerText = `Result: ${n1 + n2}`;
    };

    const subtract = () => {
        const { n1, n2 } = getValues();
        document.getElementById('result').innerText = `Result: ${n1 - n2}`;
    };

    const multiply = () => {
        const { n1, n2 } = getValues();
        document.getElementById('result').innerText = `Result: ${n1 * n2}`;
    };

    const divide = () => {
        const { n1, n2 } = getValues();
        if (n2 === 0) {
            document.getElementById('result').innerText = "Result: Cannot divide by zero";
            return;
        }
        document.getElementById('result').innerText = `Result: ${n1 / n2}`;
    };

    const modulus = () => {
        const { n1, n2 } = getValues();
        document.getElementById('result').innerText = `Result: ${n1 % n2}`;
    };

    const exponent = () => {
        const { n1, n2 } = getValues();
        document.getElementById('result').innerText = `Result: ${n1 ** n2}`;
    };
</script>

</body>
</html>
