<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Driving Age Gap</h1>
    <label for="age">Enter your age:</label>
    <input type="number" id="age" />
    <button onclick="checkDrivingEligibility()">Submit</button>
    <p id="message"></p>

    <script>
        function checkDrivingEligibility() {
            const age = parseInt(document.getElementById('age').value);
            const messageElement = document.getElementById('message');
            let message;

            if (age < 16) {
                message = "You are too young to drive.";
            } else if (age >= 16 && age < 18) {
                message = "You can drive with a learner's permit.";
            } else if (age >= 18 && age < 21) {
                message = "You can drive, but there may be restrictions.";
            } else {
                message = "You can drive without any restrictions.";
            }

            messageElement.textContent = message;
        }
    </script>
</body>
</html>
