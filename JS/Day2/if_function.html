<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Function</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        label {
            display: inline-block;
            margin-bottom: 10px;
        }
        input {
            margin-bottom: 20px;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: 1px solid yellow;
            border-radius: 20px;
            padding: 10px 20px;
            display: block;
            font-size: 16px;
            margin: 0 auto;
            cursor: pointer;
        }
        body{
            background-color: #f0f0f0;
            margin: 0 auto;
            align-items: center;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <h1>Check Your Name</h1>

    <label for="name">What is your name?</label>
    <input type="text" id="name" />
    <button onclick="checkName()">Submit</button>
    <p id="message"></p>

    </div>
    







    <script>
        function checkName() {
            const name = document.getElementById('name').value;
            const messageElement = document.getElementById('message');
            
            if (name === "Soh Soh") {
                messageElement.textContent = "Hello, Soh Soh!";
            } else if (name === "Ei Wai Lwin Htet") {
                messageElement.textContent = "Hi, Ei Wai Lwin Htet!";
            } else {
                messageElement.textContent = "Hello, stranger!";
            }
        }
    </script>

</body>
</html>
