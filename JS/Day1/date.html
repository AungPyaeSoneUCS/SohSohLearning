<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
  </head>

  <style>
    .date-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .date-row h1 {
    display: inline;
      margin: 0;
      font-size: 2rem;
    }
  </style>

  <body>
    <button
      id="btn"
      onclick="document.getElementById('displayDate').innerHTML =  Date()"
    >
      Date
    </button>

    <div class="date-row">
      <h1>Date :</h1>
      <h1 id="displayDate"></h1>
    </div>
  </body>
</html>
