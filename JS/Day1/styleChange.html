<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Change</title>
</head>
<body>
    
    <h1 id="myName">Soh Soh Zaw Wann</h1>

    <button onclick="document.getElementById('myName').style.color = 'pink'">Change Color</button>
    <button onclick="document.getElementById('myName').style.fontSize = '50px'">Change Font Size</button>
    <button onclick="document.getElementById('myName').style.fontFamily = 'Arial'">Change Font Family</button>
    <button onclick="document.getElementById('myName').style.backgroundColor = 'yellow'">Change Background Color</button>
    <button onclick="document.getElementById('myName').style.textAlign = 'center'">Change Text Align</button>
    <button onclick="document.getElementById('myName').style.border = '1px solid Green'">Change Border</button>
    <button onclick="document.getElementById('myName').style.padding = '10px'">Change Padding</button>
    <button onclick="document.getElementById('myName').style.margin = '10px'">Change Margin</button>
    <button onclick="document.getElementById('myName').style.display = 'none'">Hide</button>
    <button onclick="document.getElementById('myName').style.display = 'block'">Show</button>   
    
    
</body>
</html>
